name: Build Miryoku for Iris Rev8

on:
  workflow_dispatch:
    inputs:
      alphas:
        description: 'Alpha layout (e.g. QWERTY or COLEMAK_DH)'
        required: false
        default: 'QWERTY'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Install QMK CLI
        run: pip install qmk

      - name: Setup QMK (clones qmk_firmware master)
        run: qmk setup --yes

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi

      - name: Clone Miryoku QMK
        run: git clone https://github.com/manna-harbour/miryoku_qmk.git -b miryoku /tmp/miryoku

      - name: Copy Miryoku user files into QMK
        run: cp -r /tmp/miryoku/users/manna-harbour_miryoku ~/qmk_firmware/users/

      - name: Create keymap directory
        run: mkdir -p ~/qmk_firmware/keyboards/keebio/iris/rev8/keymaps/manna-harbour_miryoku

      - name: Create keymap.c
        run: |
          cat > ~/qmk_firmware/keyboards/keebio/iris/rev8/keymaps/manna-harbour_miryoku/keymap.c << 'EOF'
          #include "manna-harbour_miryoku.h"
          EOF

      - name: Create rules.mk
        run: |
          cat > ~/qmk_firmware/keyboards/keebio/iris/rev8/keymaps/manna-harbour_miryoku/rules.mk << 'EOF'
          USER_NAME = manna-harbour_miryoku
          EOF

      - name: Create config.h
        run: |
          cat > ~/qmk_firmware/keyboards/keebio/iris/rev8/keymaps/manna-harbour_miryoku/config.h << 'EOF'
          #pragma once
          EOF

      - name: Create layout mapping
        run: |
          cat > ~/qmk_firmware/keyboards/keebio/iris/rev8/keymaps/manna-harbour_miryoku/miryoku_custom_config.h << 'EOF'
          #pragma once
          #define LAYOUT_miryoku( \
          L00, L01, L02, L03, L04, \
          L10, L11, L12, L13, L14, \
          L20, L21, L22, L23, L24, \
               L31, L32, L33,      \
          R00, R01, R02, R03, R04, \
          R10, R11, R12, R13, R14, \
          R20, R21, R22, R23, R24, \
               R31, R32, R33       \
          ) \
          LAYOUT( \
          KC_NO, L00, L01, L02, L03, L04,   R00, R01, R02, R03, R04, KC_NO, \
          KC_NO, L10, L11, L12, L13, L14,   R10, R11, R12, R13, R14, KC_NO, \
          KC_NO, L20, L21, L22, L23, L24,   R20, R21, R22, R23, R24, KC_NO, \
          KC_NO, KC_NO, KC_NO, KC_NO, KC_NO, KC_NO, KC_NO, KC_NO,    \
                             L31, L32, L33, R31, R32, R33             \
          )
          #define MIRYOKU_MAPPING LAYOUT_miryoku
          EOF

      - name: Verify Miryoku files copied
        run: ls ~/qmk_firmware/users/manna-harbour_miryoku/

      - name: Debug Miryoku header
        run: |
          cat ~/qmk_firmware/users/manna-harbour_miryoku/manna-harbour_miryoku.h
          echo "---"
          cat ~/qmk_firmware/users/manna-harbour_miryoku/miryoku_babel/miryoku_layer_selection.h

      - name: Build firmware
        run: |
          qmk compile \
            -kb keebio/iris/rev8 \
            -km manna-harbour_miryoku \
            -e MIRYOKU_ALPHAS=${{ github.event.inputs.alphas }}

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: miryoku-iris-rev8
          path: |
            ~/qmk_firmware/*.uf2
            ~/qmk_firmware/*.hex
            ~/qmk_firmware/*.bin
